server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;
    # Cloud copy is an alternate entry; Pages remains the public indexing entry.
    add_header X-Robots-Tag "noindex, follow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { return 302 /Blog/; }
    location = /Blog { return 301 /Blog/; }
    location /api/ {
        # Redact callback query strings from error logs as well as access logs.
        error_log /dev/null;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # API deliberately does not trust arbitrary forwarded client IP headers.
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        client_max_body_size 32k;
        proxy_no_cache 1;
    }
    location = /Blog/sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
    }
    location /Blog/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, follow" always;
        try_files $uri =404;
    }
    location /Blog/ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
        try_files $uri $uri/ /Blog/index.html;
    }
    location / { return 404; }
}
