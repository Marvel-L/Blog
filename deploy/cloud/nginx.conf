server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;
    # Cloud copy is an alternate entry; Pages remains the public indexing entry.
    add_header X-Robots-Tag "noindex, follow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { return 302 /Blog/; }
    location = /Blog { return 301 /Blog/; }
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/ {
        # Redact callback query strings from error logs as well as access logs.
        error_log /dev/null;
        # Resolve at request time so the static site can start before OAuth is configured.
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # API deliberately does not trust arbitrary forwarded client IP headers.
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        # Trend accepts up to 2 MiB of state; each API enforces its own smaller limit.
        client_max_body_size 3m;
        proxy_no_cache 1;
    }
    location = /Blog/sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
    }
    location /Blog/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, follow" always;
        try_files $uri =404;
    }
    # Anki 有独立的 SSG 学习壳；精确入口不走目录跳转，保留 query 与 OAuth 回跳地址。
    # 制品缺失时返回 404，禁止用博客首页冒充 Anki 的可水合 HTML。
    location = /Blog/anki {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /Blog/anki/index.html =404;
    }
    location = /Blog/anki/login {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /Blog/anki/login/index.html =404;
    }
    location /Blog/ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
        try_files $uri $uri/ /Blog/index.html;
    }
    location / { return 404; }
}
