<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anki · 我的记忆卡片</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230071e3'/%3E%3Cpath d='M10 28L20 10L30 28M14 22H26' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <style>
      /* ===== 清透浅色：白色玻璃表面、冷灰基底、苹果蓝操作色 ===== */
      :root {
        --paper: #f5f7fa;
        --surface: rgba(255, 255, 255, 0.76);
        --ink: #1d1d1f;
        --muted: #626872;
        --line: rgba(40, 55, 80, 0.1);
        --accent: #0071e3;
        --soft: #eaf3ff;
        --error: #b33f4b;
        --warning: #94631c;
        --shadow: 0 12px 38px rgba(43, 76, 120, 0.06);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.65 'PingFang SC',
          'Microsoft YaHei',
          system-ui,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      button {
        color: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        line-height: 1.3;
        letter-spacing: -0.04em;
      }
      h2 {
        font-size: 20px;
        line-height: 1.4;
      }
      h3 {
        font-size: 18px;
        line-height: 1.4;
      }
      small,
      .small {
        font-size: 14px;
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
      svg {
        vertical-align: middle;
        flex-shrink: 0;
      }
      .icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .serif {
        font-family: 'Songti SC', 'STSong', Georgia, serif;
      }
      button {
        border: 0;
        background: none;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 17px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--surface);
        font-weight: 550;
        white-space: normal;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn.primary {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .btn.text {
        border-color: transparent;
        background: transparent;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
      }
      .muted {
        color: var(--muted);
      }
      .accent {
        color: var(--accent);
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 23px;
        font-weight: 650;
      }
      .mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        display: grid;
        place-items: center;
        font-family: Georgia, serif;
        font-weight: 700;
      }
      .brand .slash {
        color: #bfc1b9;
        font-weight: 400;
      }
      .brand .blog {
        font:
          22px Georgia,
          serif;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .top-actions .desktop {
        display: none;
      }
      .demo-label {
        color: var(--muted);
        font-size: 14px;
      }
      .notice {
        padding: 8px 18px;
        background: var(--soft);
        color: #36534c;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .shell {
        display: block;
      }
      .sidebar {
        background: var(--paper);
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      .nav {
        display: flex;
        gap: 5px;
      }
      .nav button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 10px;
        min-height: 44px;
        border-radius: 8px;
        flex: 1;
        font-weight: 550;
        white-space: nowrap;
      }
      .nav button.active {
        background: var(--soft);
        color: var(--accent);
      }
      .nav button:hover {
        background: var(--soft);
      }
      .side-section {
        display: none;
      }
      .workspace {
        padding: 25px 18px 40px;
        min-width: 0;
        max-width: 1480px;
        width: 100%;
        margin: auto;
      }
      .heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }
      .heading p {
        margin-top: 7px;
        color: var(--muted);
      }
      .heading .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .heading {
        flex-wrap: wrap;
      }
      .stats-strip {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 26px;
      }
      .metric {
        padding: 18px;
        border-right: 1px solid var(--line);
      }
      .metric:nth-child(2n) {
        border-right: 0;
      }
      .metric:nth-child(-n + 2) {
        border-bottom: 1px solid var(--line);
      }
      .metric .value {
        font-size: 28px;
        font-weight: 650;
        line-height: 1.3;
        font-variant-numeric: tabular-nums;
      }
      .metric .value span {
        font-size: 14px;
        font-weight: 400;
        color: var(--muted);
        margin-left: 5px;
      }
      .metric .label {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .section-title p {
        font-size: 14px;
        color: var(--muted);
      }
      .overview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 25px;
      }
      .daily-card {
        background: var(--accent);
        color: #fff;
        border-radius: 13px;
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .daily-card p,
      .daily-card small {
        color: #dfede7;
      }
      .daily-card h2 {
        font-size: 25px;
      }
      .daily-card .daily-number {
        font-size: 44px;
        line-height: 1.15;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .daily-card .daily-number span {
        font-size: 15px;
        font-weight: 400;
        color: #dfede7;
      }
      .daily-card .btn {
        background: #fff;
        color: var(--accent);
        border: 0;
        width: 100%;
      }
      .daily-card .progress-track {
        background: #ffffff24;
      }
      .daily-card .progress-fill {
        background: #e4f0de;
      }
      .progress-track {
        height: 7px;
        background: var(--line);
        border-radius: 20px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 20px;
      }
      .progress-caption {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 14px;
        color: var(--muted);
        margin: 10px 0 7px;
      }
      .daily-card .progress-caption {
        color: #dfede7;
      }
      .deck-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
      }
      .deck {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 22px;
        min-width: 0;
      }
      .deck-head {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 12px;
      }
      .deck-icon {
        background: var(--soft);
        color: var(--accent);
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 9px;
      }
      .deck-count {
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        color: var(--muted);
      }
      .deck h3 {
        margin-top: 15px;
      }
      .deck .description {
        min-height: 44px;
        font-size: 14px;
        color: var(--muted);
        margin-top: 6px;
      }
      .tag {
        display: inline-block;
        background: var(--paper);
        padding: 2px 9px;
        border-radius: 5px;
        font-size: 14px;
        color: var(--muted);
        margin-top: 12px;
      }
      .deck-foot {
        border-top: 1px solid var(--line);
        margin-top: 17px;
        padding-top: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .deck-foot .btn {
        min-width: 80px;
        padding: 9px 13px;
      }
      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .filter {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 14px;
        background: transparent;
      }
      .filter.active {
        color: var(--accent);
        background: var(--soft);
        border-color: #b4cec3;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        padding: 0 12px;
        min-height: 44px;
        width: 100%;
        margin: 0 0 15px;
      }
      .search input {
        border: 0;
        background: transparent;
        width: 100%;
        outline: 0;
        min-width: 0;
        font-size: 16px;
        color: var(--ink);
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        padding: 22px;
      }
      .aside-stack {
        display: flex;
        flex-direction: column;
        gap: 17px;
      }
      .chart-bars {
        height: 142px;
        display: flex;
        gap: 10px;
        align-items: flex-end;
        border-bottom: 1px solid var(--line);
        padding-top: 15px;
      }
      .bar-column {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        height: 100%;
        gap: 4px;
      }
      .bar-column .bar {
        width: 100%;
        max-width: 27px;
        min-height: 2px;
        background: #d8e4dd;
        border-radius: 4px 4px 0 0;
      }
      .bar-column.today .bar {
        background: var(--accent);
      }
      .bar-column .count {
        font-size: 14px;
        line-height: 1.1;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .chart-labels {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      .chart-labels span {
        flex: 1;
        text-align: center;
        font-size: 14px;
        color: var(--muted);
      }
      .chart-caption {
        font-size: 14px;
        color: var(--muted);
        margin-top: 12px;
      }
      .hint-list {
        list-style: none;
        padding: 0;
        margin: 14px 0 0;
        display: grid;
        gap: 13px;
      }
      .hint-list li {
        display: flex;
        gap: 12px;
      }
      .step-dot {
        border: 1px solid var(--line);
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 14px;
        flex-shrink: 0;
      }
      .review-wrap {
        max-width: 850px;
        margin: auto;
      }
      .review-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .review-meta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 14px;
      }
      .flashcard {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 25px 22px;
        min-height: 310px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        text-align: center;
        position: relative;
      }
      .flashcard .q-label {
        color: var(--accent);
        font:
          italic 29px Georgia,
          serif;
        margin-bottom: 14px;
      }
      .question {
        font-size: 26px;
        font-weight: 600;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .answer {
        margin-top: 24px;
        border-top: 1px dashed var(--line);
        padding-top: 24px;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .answer-label {
        font-size: 14px;
        color: var(--accent);
        margin-bottom: 9px;
      }
      .answer p {
        font-size: 17px;
      }
      .card-number {
        font-size: 14px;
        color: var(--muted);
        margin-top: 22px;
      }
      .reveal {
        margin-top: 22px;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .reveal .btn {
        width: 100%;
        max-width: 340px;
      }
      .ratings {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 9px;
      }
      .rating {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 8px;
        min-height: 76px;
        text-align: center;
      }
      .rating strong {
        display: block;
        font-size: 17px;
      }
      .rating small {
        display: block;
        font-size: 14px;
        margin-top: 4px;
      }
      .rating.wrong {
        color: var(--error);
        border-color: #dbbbb6;
      }
      .rating.blur {
        color: var(--warning);
        border-color: #d8c9aa;
      }
      .rating.good {
        color: var(--accent);
        border-color: #b4cec3;
      }
      .rating:hover {
        background: var(--soft);
      }
      .rating.wrong:hover {
        background: #f8ece9;
      }
      .rating.blur:hover {
        background: #f9f1e3;
      }
      .rating-switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 19px;
        font-size: 14px;
        color: var(--muted);
      }
      .custom {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .custom input {
        width: 100px;
      }
      .empty {
        padding: 38px 20px;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      .empty h2 {
        margin-bottom: 12px;
      }
      .empty p {
        color: var(--muted);
        margin-bottom: 19px;
      }
      .card-list {
        display: grid;
        gap: 12px;
      }
      .record {
        padding: 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 11px;
      }
      .record-top {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: start;
      }
      .record-q {
        font-size: 17px;
        font-weight: 550;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .record-meta {
        font-size: 14px;
        color: var(--muted);
        display: flex;
        gap: 12px;
        margin: 9px 0;
        flex-wrap: wrap;
      }
      .record-answer {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 14px;
        background: var(--paper);
        border-radius: 8px;
        margin-top: 12px;
      }
      .record .btn {
        font-size: 14px;
      }
      .stage-track {
        display: flex;
        height: 10px;
        border-radius: 10px;
        overflow: hidden;
        background: var(--line);
        margin: 15px 0 11px;
      }
      .stage-new {
        background: #d9d8ce;
      }
      .stage-learning {
        background: #b0cabe;
      }
      .stage-stable {
        background: var(--accent);
      }
      .legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 14px;
        color: var(--muted);
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .dot {
        width: 8px;
        height: 8px;
        background: var(--accent);
        border-radius: 50%;
        display: inline-block;
      }
      .statistics-grid {
        display: grid;
        gap: 20px;
      }
      .big-bars {
        height: 210px;
      }
      .days-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 5px;
        margin-top: 15px;
      }
      .day {
        border: 1px solid var(--line);
        border-radius: 6px;
        min-height: 60px;
        padding: 5px 1px;
        background: var(--paper);
        text-align: center;
        font-size: 14px;
      }
      .day strong {
        display: block;
      }
      .day.reviewed {
        background: var(--soft);
        border-color: #b4cec3;
      }
      .day.selected {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .date-field {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .date-field input {
        min-width: 0;
        max-width: 100%;
      }
      .summary-rating {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin: 14px 0;
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .summary-rating div {
        text-align: center;
        padding: 16px 8px;
      }
      .summary-rating strong {
        display: block;
        font-size: 27px;
      }
      .summary-rating small {
        display: block;
      }
      .center-gate {
        max-width: 500px;
        margin: 65px auto;
        text-align: center;
      }
      .center-gate .mark {
        margin: 0 auto 20px;
        width: 58px;
        height: 58px;
        font-size: 30px;
      }
      .center-gate p {
        margin: 15px 0 25px;
        color: var(--muted);
      }
      .home-nav {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
      }
      .home-nav .btn {
        min-height: 44px;
      }
      .home-hero {
        max-width: 900px;
        margin: 30px auto;
      }
      .home-hero h1 {
        font-size: 42px;
      }
      .home-hero .panel {
        margin-top: 27px;
      }
      .home-entry {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
        background: var(--soft);
        border: 1px solid #b4cec3;
        border-radius: 13px;
        padding: 24px;
        margin-top: 28px;
        flex-wrap: wrap;
      }
      .home-entry p {
        max-width: 510px;
      }
      .dialog {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        border-radius: 15px;
        width: calc(100% - 28px);
        max-width: 580px;
        max-height: 90dvh;
        padding: 0;
        box-shadow: 0 25px 90px #0003;
      }
      .dialog::backdrop {
        background: #1c191755;
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 19px 22px;
        border-bottom: 1px solid var(--line);
      }
      .dialog form {
        padding: 22px;
      }
      .field {
        display: block;
        margin-bottom: 17px;
      }
      .field span {
        display: block;
        font-weight: 550;
        margin-bottom: 7px;
      }
      .field small {
        display: block;
        margin-top: 6px;
      }
      input,
      select,

            browsing.index = Math.min(browsing.queue.length - 1, browsing.index + 1);

      app.addEventListener('click', action);
      app.addEventListener('pointerover', (event) => {
        const el = event.target.closest('[data-tip]');
        if (el) showTip(el);
      });
      app.addEventListener('pointerout', (event) => {
        if (event.target.closest('[data-tip]')) hideTip();
      });
      app.addEventListener('focusin', (event) => {
        const el = event.target.closest('[data-tip]');
        if (el) showTip(el);
      });
      app.addEventListener('focusout', (event) => {
        if (event.target.closest('[data-tip]')) hideTip();
      });
      window.addEventListener('scroll', hideTip, { passive: true });
      window.addEventListener('resize', hideTip);
      dialog.addEventListener('click', action);
      dialog.addEventListener('cancel', (event) => {
        event.preventDefault();
        closeDialog();
      });
      window.addEventListener('hashchange', () => {
        render();
        window.scrollTo(0, 0);
      });
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') hideTip();
        if (
          event.code === 'Space' &&
          route() === 'browse' &&
          browsing &&
          !dialog.open &&
          !event.target.closest('button,input,select,textarea,a')
        ) {
          event.preventDefault();
          browseShown = !browseShown;
          render();
        }
        if (
          event.code === 'Space' &&
          route() === 'review' &&
          session &&
          !shown &&
          !dialog.open &&
          !event.target.closest('button,input,select,textarea,a')
        ) {
          event.preventDefault();
          shown = true;
          render();
          document.querySelector('.rating')?.focus();
        }
      });
      render();
    </script>
  </body>
</html>
