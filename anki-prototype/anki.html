<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anki · 我的记忆卡片</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230071e3'/%3E%3Cpath d='M10 28L20 10L30 28M14 22H26' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <style>
      /* v3：连续阅读面；只有问答主体使用一张实体卡片。 */
      :root {
        --paper: #fff;
        --surface: #fff;
        --ink: #202124;
        --muted: #777d86;
        --line: #e9edf1;
        --accent: #087ae9;
        --soft: #f1f7ff;
        --error: #b14450;
        --warning: #996b29;
        --shadow: 0 8px 36px #1a38560a;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font:
          15px/1.65 -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 34px;
        font-weight: 620;
        line-height: 1.25;
        letter-spacing: -0.055em;
      }
      h2 {
        font-size: 21px;
        line-height: 1.4;
        font-weight: 580;
      }
      h3 {
        font-size: 18px;
        line-height: 1.5;
        font-weight: 560;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.38;
        cursor: not-allowed;
      }
      [hidden] {
        display: none !important;
      }
      button,
      a {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      .icon {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
        flex-shrink: 0;
      }
      .muted,
      .small,
      small {
        color: var(--muted);
      }
      .small,
      small {
        font-size: 14px;
      }
      .accent {
        color: var(--accent);
      }
      .btn {
        min-height: 44px;
        padding: 9px 17px;
        border: 1px solid var(--line);
        border-radius: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #fff;
        font-weight: 500;
        font-size: 14px;
        white-space: nowrap;
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .btn.primary:hover {
        background: #006ed7;
      }
      .btn:hover {
        border-color: #b6cce2;
      }
      .btn.text {
        border-color: transparent;
        background: transparent;
        color: var(--accent);
        padding-left: 8px;
        padding-right: 8px;
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        color: var(--muted);
      }
      .icon-btn:hover {
        background: #f4f7fa;
      }
      .topbar {
        border-bottom: 1px solid var(--line);
        background: #ffffffd9;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .top-inner {
        max-width: 1160px;
        margin: auto;
        padding: 14px 22px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 21px;
        font-weight: 620;
        letter-spacing: -0.045em;
      }
      .brand .blog {
        font-size: 15px;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: 0;
      }
      .brand .slash {
        font-size: 15px;
        color: #c5cbd1;
      }
      .mark {
        background: var(--accent);
        color: #fff;
        width: 25px;
        height: 29px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        font-weight: 600;
        font-size: 17px;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .desktop {
        display: none;
      }
      .nav {
        display: flex;
        width: 100%;
        justify-content: center;
        gap: 26px;
        order: 3;
      }
      .nav button {
        color: var(--muted);
        font-size: 14px;
        min-height: 49px;
        padding: 8px 0;
        border-bottom: 2px solid transparent;
      }
      .nav button.active {
        border-bottom-color: var(--ink);
        color: var(--ink);
        font-weight: 550;
      }
      .nav button:hover {
        color: var(--ink);
      }
      .shell {
        display: block;
      }
      .workspace {
        width: 100%;
        max-width: 1120px;
        margin: auto;
        padding: 40px 22px 65px;
        min-width: 0;
      }
      .demo-note {
        max-width: 1120px;
        margin: auto;
        padding: 18px 22px 26px;
        font-size: 14px;
        color: #777d86;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 15px;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 30px;
      }
      .heading p {
        margin-top: 10px;
        color: var(--muted);
      }
      .heading .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .overview-intro {
        display: flex;
        justify-content: space-between;
        gap: 26px;
        flex-wrap: wrap;
        padding-bottom: 26px;
      }
      .overview-intro h1 {
        font-size: 38px;
      }
      .overview-intro p {
        margin-top: 10px;
        max-width: 550px;
        color: var(--muted);
      }
      .today-action {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 9px;
      }
      .today-action .btn {
        padding: 12px 24px;
        min-height: 47px;
      }
      .today-action .small {
        font-size: 14px;
      }
      .metrics-inline {
        display: flex;
        gap: 20px 30px;
        flex-wrap: wrap;
        padding: 8px 0 33px;
      }
      .metrics-inline .metric {
        display: flex;
        align-items: baseline;
        gap: 7px;
      }
      .metric .value {
        font-size: 24px;
        font-weight: 550;
        font-variant-numeric: tabular-nums;
      }
      .metric .label {
        font-size: 14px;
        color: var(--muted);
      }
      .goal-inline {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 0 30px;
        color: var(--muted);
        font-size: 14px;
      }
      .goal-inline .progress-track {
        width: 110px;
      }
      .goal-inline .btn {
        min-height: 44px;
      }
      .progress-track {
        height: 4px;
        background: #eef1f4;
        border-radius: 20px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 20px;
      }
      .progress-caption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 14px;
        margin: 11px 0 8px;
      }
      .library-toolbar {
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 21px 0 15px;
        gap: 16px;
        flex-wrap: wrap;
      }
      .filters {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
      }
      .filter {
        min-height: 44px;
        padding: 7px 0;
        color: var(--muted);
        font-size: 14px;
      }
      .filter.active {
        color: var(--ink);
        font-weight: 550;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        border-bottom: 1px solid var(--line);
        width: 100%;
        max-width: 240px;
        color: #949aa2;
      }
      .search input {
        border: 0;
        background: none;
        padding: 8px 0;
        min-width: 0;
        width: 100%;
        font-size: 16px;
        outline-offset: 4px;
      }
      .library-meta {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .deck-list {
        display: block;
      }
      .deck-row {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 14px;
        align-items: center;
        padding: 23px 0;
        border-bottom: 1px solid var(--line);
      }
      .deck-row:first-child {
        border-top: 1px solid var(--line);
      }
      .deck-glyph {
        font-size: 19px;
        font-weight: 550;
        display: grid;
        place-items: center;
        width: 38px;
        height: 42px;
        color: #538aa9;
        background: #f0f6f9;
        border-radius: 8px;
      }
      .deck-row:nth-child(2n) .deck-glyph {
        color: #609889;
        background: #eff7f3;
      }
      .deck-title {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      .deck-title .category {
        font-size: 14px;
        color: var(--muted);
      }
      .deck-copy p {
        font-size: 14px;
        color: var(--muted);
        margin-top: 5px;
        overflow-wrap: anywhere;
      }
      .deck-progress {
        grid-column: 2;
        font-size: 14px;
        color: var(--muted);
      }
      .deck-progress-top {
        display: flex;
        gap: 18px;
        align-items: baseline;
        margin-bottom: 9px;
      }
      .deck-progress .progress-track {
        width: 125px;
      }
      .deck-progress small {
        display: block;
        margin-top: 7px;
      }
      .deck-controls {
        grid-column: 2;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .deck-controls .btn {
        padding: 8px 14px;
      }
      .page-tail {
        margin-top: 28px;
        font-size: 14px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }
      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .section-title p {
        font-size: 14px;
        color: var(--muted);
      }
      .panel {
        background: none;
        border: 0;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .statistics-grid {
        display: block;
      }
      .stats-intro {
        display: flex;
        gap: 24px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 35px;
      }
      .stats-intro .metrics-inline {
        padding: 0;
      }
      .chart-heading {
        padding-top: 26px;
        border-top: 1px solid var(--line);
        margin-bottom: 8px;
      }
      .line-chart {
        width: 100%;
        min-width: 0;
        position: relative;
      }
      .line-chart svg {
        display: block;
        width: 100%;
        height: 240px;
      }
      .line-stroke {
        fill: none;
        stroke: #428dd2;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .chart-grid {
        stroke: #ecf0f4;
        stroke-width: 1;
      }
      .chart-axis-text {
        font:
          14px -apple-system,
          'PingFang SC',
          sans-serif;
        fill: #8b929a;
      }
      .chart-dot {
        fill: #fff;
        stroke: #428dd2;
        stroke-width: 1.6;
      }
      .chart-caption {
        font-size: 14px;
        color: var(--muted);
        margin-top: 12px;
        max-width: none;
      }
      .heatmap-panel {
        margin: 37px 0 0;
        padding: 26px 0;
        border-top: 1px solid var(--line);
      }
      .heatmap-scroll {
        overflow-x: auto;
        padding: 8px 1px 4px;
      }
      .heatmap-layout {
        --cell: 14px;
        --gap: 4px;
        display: grid;
        grid-template-columns: 22px max-content;
        gap: 7px;
        min-width: 260px;
      }
      .weekday-labels {
        display: grid;
        grid-template-rows: 24px repeat(7, var(--cell));
        row-gap: var(--gap);
        font-size: 14px;
        color: #8b929a;
      }
      .weekday-labels span {
        line-height: var(--cell);
      }
      .heat-months {
        display: grid;
        grid-template-columns: repeat(13, var(--cell));
        gap: var(--gap);
        height: 24px;
        font-size: 14px;
        color: #8b929a;
        white-space: nowrap;
      }
      .heat-cells {
        display: grid;
        grid-template-columns: repeat(13, var(--cell));
        grid-template-rows: repeat(7, var(--cell));
        grid-auto-flow: column;
        gap: var(--gap);
      }
      .heat-cell {
        height: var(--cell);
        width: var(--cell);
        min-height: 0;
        min-width: 0;
        padding: 0;
        background: var(--heat);
        border-radius: 3px;
        border: 1px solid #172c3910;
      }
      .heat-cell.selected {
        box-shadow: inset 0 0 0 1px #418bb9;
      }
      .heat-cell:hover,
      .heat-cell:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .heat-cell.placeholder {
        visibility: hidden;
      }
      .heat-legend {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 18px;
        color: var(--muted);
        font-size: 14px;
      }
      .heat-scale {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .heat-scale i {
        width: 12px;
        height: 12px;
        display: block;
        background: var(--heat);
        border-radius: 2px;
      }
      .daily-detail {
        padding-top: 27px;
        border-top: 1px solid var(--line);
      }
      .daily-detail-grid {
        display: grid;
        gap: 25px;
      }
      .date-field {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 18px;
      }
      .split-title {
        display: flex;
        align-items: baseline;
        gap: 15px;
        flex-wrap: wrap;
      }
      .split-title h2 {
        font-size: 24px;
      }
      .summary-rating {
        display: flex;
        gap: 38px;
        padding: 15px 0;
      }
      .summary-rating strong {
        display: block;
        font-size: 24px;
        font-weight: 550;
      }
      .summary-rating small {
        font-size: 14px;
      }
      .review-wrap {
        max-width: 780px;
        margin: auto;
      }
      .review-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
        font-size: 14px;
      }
      .review-meta {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 14px;
      }
      .flashcard {
        min-height: 320px;
        background: #f8fbfd;
        border: 1px solid #e9f0f5;
        border-radius: 18px;
        padding: 33px 25px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }
      .q-label {
        color: #b0c0cd;
        font-size: 15px;
        font-weight: 500;
        margin-bottom: 25px;
      }
      .question {
        font-size: 26px;
        line-height: 1.7;
        letter-spacing: -0.03em;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-weight: 540;
      }
      .answer {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        text-align: left;
        border-top: 1px solid #e0e9f0;
        padding-top: 24px;
        margin-top: 30px;
      }
      .answer-label {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .answer p {
        font-size: 17px;
        line-height: 1.9;
      }
      .card-number {
        font-size: 14px;
        color: var(--muted);
        margin-top: 27px;
      }
      .reveal {
        margin-top: 25px;
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 12px;
      }
      .reveal .btn {
        padding: 12px 36px;
      }
      .rating-switch {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 25px;
        font-size: 14px;
        color: var(--muted);
      }
      .ratings {
        display: flex;
        gap: 0;
        margin-top: 17px;
        background: #f7f9fb;
        border-radius: 12px;
        padding: 5px;
      }
      .rating {
        flex: 1;
        padding: 15px 7px;
        min-height: 76px;
        border-radius: 8px;
      }
      .rating:hover {
        background: #fff;
      }
      .rating strong {
        display: block;
        font-size: 17px;
        font-weight: 550;
      }
      .rating small {
        display: block;
        font-size: 14px;
        margin-top: 5px;
      }
      .wrong {
        color: var(--error);
      }
      .blur {
        color: var(--warning);
      }
      .good {
        color: var(--accent);
      }
      .custom {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 22px;
        font-size: 14px;
        color: var(--muted);
      }
      .custom input {
        width: 86px;
      }
      .save-help,
      .browse-note {
        color: var(--muted);
        font-size: 14px;
        margin-top: 20px;
      }
      .random-controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .browse-note {
        text-align: center;
      }
      .card-list {
        display: block;
      }
      .record {
        border-bottom: 1px solid var(--line);
        padding: 23px 0;
        background: none;
      }
      .record:first-child {
        border-top: 1px solid var(--line);
      }
      .record-top {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 16px;
      }
      .record-q {
        font-size: 18px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-weight: 520;
      }
      .record-meta {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 14px;
        margin: 9px 0;
      }
      .record-answer {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 16px;
        color: #4e5964;
        margin-top: 15px;
        line-height: 1.9;
      }
      .stage-track {
        display: flex;
        height: 5px;
        border-radius: 20px;
        overflow: hidden;
        background: #edf1f4;
        margin: 18px 0 14px;
        max-width: 460px;
      }
      .stage-new {
        background: #e1e8ef;
      }
      .stage-learning {
        background: #adcde4;
      }
      .stage-stable {
        background: #428dd2;
      }
      .legend {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        font-size: 14px;
        color: var(--muted);
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }
      .tag {
        font-size: 14px;
        color: var(--muted);
      }
      .spacer {
        margin-top: 30px;
      }
      .empty {
        padding: 42px 0;
        text-align: center;
      }
      .empty p {
        color: var(--muted);
        margin: 12px 0 22px;
      }
      .completion {
        padding: 50px 0;
        text-align: center;
      }
      .completion .mark {
        margin: 0 auto 24px;
      }
      .completion p {
        color: var(--muted);
        margin: 17px auto 24px;
      }
      .completion-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .center-gate {
        max-width: 500px;
        margin: 50px auto;
        text-align: center;
      }
      .center-gate .mark {
        margin: 0 auto 24px;
      }
      .center-gate p {
        margin: 18px 0 25px;
        color: var(--muted);
      }
      .home-hero {
        max-width: 800px;
        margin: 28px auto;
      }
      .home-hero h1 {
        font-size: 38px;
      }

  <body>

    <script>
      'use strict';
      /* ===== 原型边界：这是本机演示，不是身份认证或数据库实现 ===== */
      const KEY = 'd-blog-anki-prototype-v1';
      const $ = (selector) => document.querySelector(selector);
      const escapeHTML = (value) =>
        String(value ?? '').replace(
          /[&<>"']/g,
          (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char],
        );
      const icon = (name) => {
        const paths = {
          deck: '<rect x="5" y="7" width="14" height="14" rx="2"/><path d="M8 3h10a3 3 0 0 1 3 3v11M9 12h6M9 16h4"/>',
          today: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-12 5 2 2 4-4"/>',
          stats: '<path d="M4 20h17M7 16V9m5 7V4m5 12v-6"/>',
          plus: '<path d="M12 5v14M5 12h14"/>',
          arrow: '<path d="m14 5-7 7 7 7M7 12h14"/>',
          search: '<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',
          close: '<path d="m6 6 12 12M6 18 18 6"/>',
          check: '<path d="m5 12 4 4L19 6"/>',
          exit: '<path d="M10 4H5v16h5m5-13 5 5-5 5M9 12h11"/>',
          eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
        };
        return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' + (paths[name] || paths.deck) + '</svg>';
      };
      const dateKey = (date) =>
        [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, '0'),
          String(date.getDate()).padStart(2, '0'),
        ].join('-');
      const today = () => dateKey(new Date());
      const previousDay = (offset) => {
        const d = new Date();
        d.setDate(d.getDate() - offset);
        return dateKey(d);
      };
      const id = (prefix) => prefix + '-' + crypto.randomUUID();
      function seed() {
        const now = Date.now();
        const decks = [
          { id: 'go', name: 'Go 语言', category: '编程', description: '从语法到并发，建立自己的知识索引。' },
          { id: 'system', name: '系统设计', category: '编程', description: '用一问一答梳理缓存、队列与分布式系统。' },
          { id: 'english', name: '英语表达', category: '语言', description: '不只是认得单词，也能主动回忆并使用。' },
          { id: 'reading', name: '阅读摘录', category: '阅读', description: '把读过的内容，变成能再次想起的知识。' },
        ];
        const raw = [
          [
            'go',
            'goroutine 和线程有什么区别？',
            'goroutine 是由 Go 运行时调度的轻量级并发执行单元；线程由操作系统调度。多个 goroutine 可以复用线程执行。',
            0,
          ],
          [
            'go',
            'defer 在什么时候执行？',
            '在所在函数返回前执行。多个 defer 按后进先出顺序执行；调用参数在注册 defer 时求值。',
            3,
          ],
          [
            'go',
            'channel 的生产者和消费者分别做什么？',
            '生产者把消息发送进 channel；消费者从 channel 接收消息，并执行对应处理。关闭 channel 通常由发送方负责。',
            21,
          ],
          [
            'go',
            'slice 和 array 的区别是什么？',
            'array 的长度是类型的一部分；slice 是描述底层数组片段的结构，包含指针、长度和容量。',
            0,
          ],
          [
            'system',
            '为什么缓存穿透会影响数据库？',
            '请求访问不存在的数据，缓存无法命中。如果没有额外防护，每次请求都会继续查询数据库。',
            2,
          ],
          [
            'system',
            '消息队列在订单流程中如何使用？',
            '订单服务发送订单事件；消息队列传递事件；库存或通知服务接收消息，执行扣减库存或发送通知等任务。',
            0,
          ],
          ['system', '什么是幂等操作？', '同一个操作执行一次或多次，在约定范围内产生相同的最终效果。', 28],
          ['system', '什么是缓存雪崩？', '大量缓存同时失效，或缓存服务不可用，导致大量请求集中进入后端。', 4],
          [
            'english',
            'recall 和 recognize 在学习语境中有什么区别？',
            'recall 指主动回忆；recognize 指看到提示后识别。闪卡练习更强调主动回忆。',
            0,
          ],
          ['english', '如何表达“我需要再想一想”？', 'I need to think about it a little more.', 5],
          [
            'english',
            'revisit 在学习语境中是什么意思？',
            '重新回顾、再次讨论，例如：Let’s revisit this idea next week.',
            22,
          ],
          [
            'english',
            'consistent 的常见含义是什么？',
            '一致的、持续稳定的，例如：consistent practice（持续稳定的练习）。',
            0,
          ],
          [
            'reading',
            '读完一章后，如何把内容转成卡片？',
            '先确定一个具体问题，再用自己的话写出答案。一张卡片尽量只考察一个知识点。',
            2,
          ],
          [
            'reading',
            '为什么卡片的 Q 不应过于宽泛？',
            '宽泛的问题难以判断是否回答正确；具体问题有助于明确回忆目标和自评标准。',
            24,
          ],
          [
            'reading',
            '如何区分理解和熟悉感？',
            '不看原文，用自己的话解释或举例。能解释出来比“看着眼熟”更能反映理解。',
            0,
          ],
          ['reading', '卡片答案太长时可以怎么处理？', '按独立知识点拆卡，保留清晰的提问和可核对的答案。', 3],
        ];
        const cards = raw.map((row, i) => ({
          id: 'card-' + i,
          deckId: row[0],
          q: row[1],
          a: row[2],
          interval: row[3],
          due: row[3] >= 21 ? now + row[3] * 86400000 : now - 86400000,
          last: row[3] ? now - 2 * 86400000 : null,
          created: now - 7 * 86400000,
        }));
        const logs = [];
        [5, 8, 0, 6, 10, 7].forEach((count, i) => {
          for (let j = 0; j < count; j++) {
            const card = cards[j % cards.length];
            logs.push({
              id: 'example-' + i + '-' + j,
              cardId: card.id,
              deckId: card.deckId,
              day: previousDay(6 - i),
              rating: ['good', 'good', 'blur', 'wrong'][j % 4],
              at: now - (6 - i) * 86400000,
              sample: true,
            });
          }
        });
        return { version: 1, decks, cards, logs, goal: 12, demoSession: true };
      }
      let storageError = '';
      function validate(data) {
        if (
          !data ||
          data.version !== 1 ||
          !Array.isArray(data.decks) ||
          !Array.isArray(data.cards) ||
          !Array.isArray(data.logs) ||
          !Number.isInteger(data.goal) ||
          data.goal < 1 ||
          data.goal > 500 ||
          typeof data.demoSession !== 'boolean'
        )
          throw new Error('数据结构不匹配');
        const ids = new Set();
        for (const d of data.decks) {
          if (
            typeof d.id !== 'string' ||
            ids.has(d.id) ||
            !d.name ||
            typeof d.name !== 'string' ||
            typeof d.category !== 'string' ||
            typeof d.description !== 'string'
          )
            throw new Error('卡片库格式错误');
          ids.add(d.id);
        }
        const cardIds = new Set();
        for (const c of data.cards) {
          if (
            typeof c.id !== 'string' ||
            cardIds.has(c.id) ||
            !ids.has(c.deckId) ||
            typeof c.q !== 'string' ||
            !c.q.trim() ||
            typeof c.a !== 'string' ||
            !c.a.trim() ||
            !Number.isFinite(c.interval) ||
            c.interval < 0 ||
            !Number.isFinite(c.due) ||
            (c.last !== null && !Number.isFinite(c.last))
          )
            throw new Error('卡片格式错误');
          cardIds.add(c.id);
        }
        for (const l of data.logs) {
          if (
            !cardIds.has(l.cardId) ||
            !ids.has(l.deckId) ||
            !['good', 'blur', 'wrong', 'custom'].includes(l.rating) ||
            !/^\d{4}-\d{2}-\d{2}$/.test(l.day) ||
            !Number.isFinite(l.at)
          )
            throw new Error('练习记录格式错误');
        }
        return data;
      }
      function load() {
        try {
          const raw = localStorage.getItem(KEY);
          return raw ? validate(JSON.parse(raw)) : seed();
        } catch (error) {
          storageError = '本地记录读取失败，现显示临时示例。原记录不会被覆盖；请勿在此输入重要数据。';
          return seed();
        }
      }
      let data = load();
      let filter = '全部',
        search = '',
        selectedDay = today(),
        session = null,
        browsing = null,
        browseShown = false,
        shown = false,
        showIntervals = false,
        toastTimer,
        dialogReturn;
      const app = $('#app'),
        dialog = $('#editor');
      function persist(next) {
        if (storageError) {
          toast('存储不可用，操作未保存。请修复本地存储后再试。');
          return false;
        }
        try {
          validate(next);
          localStorage.setItem(KEY, JSON.stringify(next));
          data = next;
          return true;
        } catch (error) {
          toast('保存失败，本次操作未生效。浏览器可能禁用了本地存储。');
          return false;
        }
      }
      function change(fn) {
        const next = structuredClone(data);
        fn(next);
        return persist(next);
      }
      function toast(message) {
        clearTimeout(toastTimer);
        $('#toast').textContent = message;
        $('#toast').hidden = false;
        toastTimer = setTimeout(() => {
          $('#toast').hidden = true;
        }, 4200);
      }
      const categories = () => ['全部', ...new Set(data.decks.map((d) => d.category))];
      const deckById = (value) => data.decks.find((d) => d.id === value);
      const cardById = (value) => data.cards.find((c) => c.id === value);
      const stage = (c) => (c.last === null ? 'new' : c.interval >= 21 ? 'stable' : 'learning');
      const stageName = (c) => ({ new: '未学习', learning: '学习中', stable: '熟练' })[stage(c)];
      const dueCards = (deckId) => data.cards.filter((c) => (!deckId || c.deckId === deckId) && c.due <= Date.now());
      const dayLogs = (day) => data.logs.filter((l) => l.day === day);
      const uniqueCount = (logs) => new Set(logs.map((l) => l.cardId)).size;
      const doneToday = () => uniqueCount(dayLogs(today()));
      function streak() {
        let n = 0;
        let offset = dayLogs(today()).length ? 0 : 1;
        while (n < 366 && dayLogs(previousDay(offset + n)).length) n++;
        return n;
      }
      function route() {
        return location.hash.slice(1) || 'overview';
      }
      function go(value) {
        if (route() === value) {
          render();
          return;
        }
        location.hash = value;
      }

      function header(home = false) {
        const r = route(),
          active = r === 'stats' ? 'stats' : r === 'review' ? 'review' : 'overview';
        const nav =
          data.demoSession && !home
            ? `<nav class="nav" aria-label="Anki 导航">${[
                ['overview', '卡片库'],
                ['review', '今日练习'],
                ['stats', '学习统计'],

                .map(
                  ([key, label]) =>
                    `<button data-action="nav" data-route="${key}" class="${active === key ? 'active' : ''}" ${active === key ? 'aria-current="page"' : ''}>${label}</button>`,
                )
                .join('')}</nav>`
            : '';
        return `<header class="topbar"><div class="top-inner"><a class="brand" href="#home" aria-label="返回博客入口演示"><span class="mark">A</span><span>Anki</span><span class="slash">/</span><span class="blog">Blog</span></a>${nav}<div class="top-actions">${home ? '<a class="btn primary" href="#overview">进入 Anki</a>' : '<a class="btn text desktop" href="#home">返回博客</a>'}${data.demoSession ? `<button class="icon-btn" data-action="logout" aria-label="退出演示账号" title="退出演示账号">${icon('exit')}</button>` : '<button class="btn" data-action="login">演示登录</button>'}</div></div></header>${storageError ? '<div class="storage-warning" role="alert">' + escapeHTML(storageError) + '</div>' : ''}`;
      }
      function prototypeNote() {
        return '<footer class="demo-note"><span>演示原型 · 本机存储，未接入真实登录与数据库</span><span>设计方向 v3</span></footer>';

      function metrics() {
        const due = dueCards(),

          ['可学新卡', newCount, '张'],
          ['今日已练', doneToday(), '张'],
          ['连续练习', streak(), '天'],
        ]
          .map(
            ([label, n, unit]) =>
              `<div class="metric"><span class="label">${label}</span><strong class="value">${n}</strong><span class="small">${unit}</span></div>`,
          )
          .join('')}</div>`;
      }

      function deckTile(d) {
        const cards = data.cards.filter((c) => c.deckId === d.id),
          trained = cards.filter((c) => c.last !== null).length,
          stable = cards.filter((c) => stage(c) === 'stable').length,
          p = cards.length ? Math.round((trained / cards.length) * 100) : 0,
          due = dueCards(d.id).length;
        return `<article class="deck-row"><span class="deck-glyph" aria-hidden="true">${escapeHTML(d.name.slice(0, 1))}</span><div class="deck-copy"><div class="deck-title"><a href="#deck/${encodeURIComponent(d.id)}"><h3>${escapeHTML(d.name)}</h3></a><span class="category">${escapeHTML(d.category)}</span></div><p>${escapeHTML(d.description || '从一个明确的问题开始记录。')}</p></div><div class="deck-progress"><div class="deck-progress-top"><span>${cards.length} 张卡片</span><span>${p}% 已学</span></div><div class="progress-track" role="progressbar" aria-label="${escapeHTML(d.name)}已学覆盖率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><div class="progress-fill" style="width:${p}%"></div></div><small>已学 ${trained} / ${cards.length} · 熟练 ${stable} · 待练 ${due}</small></div><div class="deck-controls"><button class="btn text" data-action="browse" data-deck="${escapeHTML(d.id)}" ${!cards.length ? 'disabled' : ''}>随机浏览</button><button class="btn" data-action="start" data-deck="${escapeHTML(d.id)}" ${!due ? 'disabled' : ''}>${due ? '练习 ' + due + ' 张' : '暂无到期'}</button></div></article>`;
      }

      function libraryResults() {
        const results = data.decks.filter(
          (d) =>
            (filter === '全部' || d.category === filter) &&
            [d.name, d.description, d.category].join(' ').toLowerCase().includes(search.toLowerCase()),
        );

          custom = logs.filter((l) => l.rating === 'custom').length,
          pct = Math.min(100, Math.round((distinct / data.goal) * 100));
        return `<div class="heading"><div><h1>学习统计</h1><p>每一次主动回忆，都会留下记录。</p></div><button class="btn text" data-action="goal">每日目标 ${data.goal} 张</button></div><div class="stats-intro">${metrics()}</div><section aria-label="练习趋势"><div class="section-title chart-heading"><h2>近 7 日练习量</h2><span class="small">张 / 日内去重</span></div>${trendLine()}<p class="chart-caption">只统计完成自评的卡片。历史包含演示记录，今天随练习更新。</p></section>${heatmap()}<section class="daily-detail"><div class="section-title"><h2>当天明细</h2><label class="date-field">日期 <input id="stat-date" type="date" value="${selectedDay}" max="${today()}"></label></div><div class="daily-detail-grid"><div><div class="split-title"><h2>${distinct} 张不同卡片</h2><span class="small">${logs.length} 次评价</span></div><div class="progress-caption"><span>以当前目标 ${data.goal} 张计算</span><span>${pct}%</span></div><div class="progress-track" role="progressbar" aria-label="选定日期目标进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="progress-fill" style="width:${pct}%"></div></div><div class="summary-rating"><div class="good"><strong>${correct}</strong><small>正确 / 次</small></div><div class="blur"><strong>${blur}</strong><small>模糊 / 次</small></div><div class="wrong"><strong>${wrong}</strong><small>错误 / 次</small></div></div><p class="small">自定义间隔 ${custom} 次；自定义不推断答对或答错。</p></div><div><h3>练习过的卡片库</h3>${
          logs.length
            ? data.decks
                .map((d) => {
                  const items = logs.filter((l) => l.deckId === d.id);
                  return items.length
                    ? `<div class="record-meta" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>${escapeHTML(d.name)}</span><span>${uniqueCount(items)} 张 / ${items.length} 次</span></div>`
                    : '';
                })
                .join('')
            : '<p class="small" style="margin-top:12px">这一天还没有练习记录。</p><button class="btn text" data-action="start">开始练习</button>'
        }</div></div><p class="chart-caption">统计按本机日期分组；正式版时区和历史目标口径待确认。${logs.some((l) => l.sample) ? '此日包含演示记录。' : ''}</p></section>`;
      }

      function home() {
        return (
          '<main class="workspace"><div class="home-hero"><p class="muted">博客主页入口示意 · 不替代现有主页</p><h1 class="serif" style="margin-top:15px">记录思考，也练习记忆。</h1><p class="muted" style="margin-top:15px">Anki 作为独立模块进入，不把卡片管理堆进文章列表。</p><section class="home-entry"><div><h2>Anki 记忆卡片</h2><p class="muted">按分类整理 Q &amp; A，练习后自评，让知识在合适的时间再次出现。</p></div><a class="btn primary" href="#overview">' +
          icon('deck') +
          '进入 Anki</a></section><section class="panel"><h2>进入后的展示方式</h2><p class="muted" style="margin-top:12px">使用自己的导航与学习布局，收起博客文章区，保留返回博客入口。这里只演示跳转，原博客与 Love 面均未修改。</p></section></div></main>'
        );
      }
      function gate() {
        return '<main class="workspace"><section class="center-gate panel"><div class="mark">A</div><h1>登录后，查看自己的卡片库</h1><p>卡片库与练习进度属于你。正式版将复用博客账号，并由服务端隔离数据。</p><button class="btn primary" data-action="login">使用演示账号进入</button><p class="small">本原型不收集密码，不验证身份。演示数据只保存在当前浏览器，不能用于保存私密信息。</p></section></main>';
      }
      function render() {
        hideTip();
        if (chartObserver) {
          chartObserver.disconnect();
          chartObserver = null;
        }
        const r = route();
        if (r === 'home') {
          app.innerHTML = header(true) + home() + prototypeNote();
          return;
        }
        if (!data.demoSession) {
          app.innerHTML = header() + gate() + prototypeNote();
          return;
        }
        const view =
          r === 'stats'
            ? stats()
            : r === 'review'
              ? review()
              : r === 'browse'
                ? browseView()
                : r.startsWith('deck/')
                  ? deckDetail(decodeURIComponent(r.slice(5)))
                  : overview();
        app.innerHTML =
          header() +
          '<div class="shell">' +
          '<main class="workspace" id="main-content">' +
          view +
          '</main></div>' +
          prototypeNote();
        mountTrend();
        const searchEl = $('#deck-search');
        if (searchEl)
          searchEl.addEventListener('input', () => {
            search = searchEl.value;
            $('#deck-results').innerHTML = libraryResults();
          });
        const toggle = $('#interval-toggle');
        if (toggle)
          toggle.addEventListener('change', () => {
            showIntervals = toggle.checked;
            render();
            $('#interval-toggle').focus();
          });
        const statDate = $('#stat-date');
        if (statDate)
          statDate.addEventListener('change', () => {
            if (statDate.value && statDate.value <= today()) {
              selectedDay = statDate.value;
              render();
            }
          });
      }
      /* ===== 表单：原生 dialog 焦点陷阱 + 输入转义 ===== */
      function closeDialog() {
        dialog.close();
        if (dialogReturn?.isConnected) dialogReturn.focus();
      }
      function openEditor(type, deckId, cardId) {
        if (!data.demoSession) return;
        dialogReturn = document.activeElement;
        const c = cardId ? cardById(cardId) : null;
        if (type === 'card' && !data.decks.length) {
          toast('请先创建一个卡片库。');
          openEditor('deck');
          return;
        }
        const titles = { deck: '新建卡片库', card: c ? '编辑 Q & A 卡片' : '录入 Q & A 卡片', goal: '每日练习目标' };
        let fields = '';
        if (type === 'deck')
          fields =
            '<label class="field"><span>卡片库名称</span><input name="name" maxlength="50" placeholder="例如：Go 并发编程" required autofocus></label><label class="field"><span>所属分类</span><input name="category" list="category-options" maxlength="30" placeholder="选择已有分类，或输入新分类" required><datalist id="category-options">' +
            categories()
              .slice(1)
              .map((cat) => '<option value="' + escapeHTML(cat) + '"></option>')
              .join('') +
            '</datalist></label><label class="field"><span>简介（选填）</span><textarea name="description" maxlength="200" placeholder="这个卡片库想记录什么？"></textarea></label>';
        if (type === 'card')
          fields =
            '<label class="field"><span>所属卡片库</span><select name="deckId" required>' +
            data.decks
              .map(
                (d) =>
                  '<option value="' +
                  escapeHTML(d.id) +
                  '" ' +
                  ((c ? c.deckId : deckId) === d.id ? 'selected' : '') +
                  '>' +
                  escapeHTML(d.category + ' / ' + d.name) +
                  '</option>',
              )
              .join('') +
            '</select></label><label class="field"><span>Q · 问题</span><textarea name="q" maxlength="3000" placeholder="写下一个具体、可回忆的问题" required autofocus>' +
            escapeHTML(c?.q || '') +
            '</textarea></label><label class="field"><span>A · 答案</span><textarea name="a" maxlength="10000" placeholder="写下便于核对的答案" required>' +
            escapeHTML(c?.a || '') +
            '</textarea><small>以纯文本保存。练习和浏览列表时，答案默认隐藏。</small></label>' +
            (c ? '<p class="small">编辑保留原复习排期；是否重置学习状态留待正式版确认。</p>' : '');
        if (type === 'goal')
          fields =
            '<label class="field"><span>每天想练习多少张不同卡片？</span><input name="goal" type="number" min="1" max="500" step="1" value="' +
            data.goal +
            '" required autofocus><small>目标影响展示，不限制练习。重复评价同一卡片，只计一张完成量。</small></label>';
        dialog.innerHTML =
          '<div class="dialog-head"><h2 id="dialog-title">' +
          titles[type] +
          '</h2><button class="icon-btn" data-action="close" aria-label="关闭表单">' +
          icon('close') +
          '</button></div><form><div class="error-box" id="form-error" role="alert" hidden></div>' +
          fields +
          '<div class="form-actions"><button type="button" class="btn" data-action="close">取消</button><button type="submit" class="btn primary">' +
          (type === 'deck' ? '创建卡片库' : type === 'card' ? '保存卡片' : '保存目标') +
          '</button></div></form>';
        dialog.showModal();
        const form = dialog.querySelector('form');
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const fd = new FormData(form),
            text = (key) => String(fd.get(key) || '').trim();
          const error = (message) => {
            const box = $('#form-error');
            box.hidden = false;
            box.textContent = message;
          };
          let ok = false;
          if (type === 'deck') {
            const name = text('name'),
              category = text('category');
            if (!name || !category) return error('名称和分类不能仅为空格。');
            if (data.decks.some((d) => d.name === name && d.category === category))
              return error('此分类下已存在同名卡片库。');
            ok = change((next) =>
              next.decks.push({ id: id('deck'), name, category, description: text('description') }),
            );
          } else if (type === 'card') {
            const q = text('q'),
              a = text('a'),
              target = text('deckId');
            if (!q || !a) return error('问题和答案不能为空或仅为空格。');
            if (!deckById(target)) return error('所选卡片库不存在。');
            if (c && session && session.index < session.queue.length) return error('请先退出当前练习，再编辑卡片。');
            ok = change((next) => {
              if (c) {
                Object.assign(
                  next.cards.find((x) => x.id === c.id),
                  { q, a, deckId: target },
                );
              } else {
                next.cards.push({
                  id: id('card'),
                  deckId: target,
                  q,
                  a,
                  due: Date.now(),
                  interval: 0,
                  last: null,
                  created: Date.now(),
                });
              }
            });
          } else {
            const goal = Number(text('goal'));
            if (!Number.isInteger(goal) || goal < 1 || goal > 500) return error('目标应为 1–500 之间的整数。');
            ok = change((next) => {
              next.goal = goal;
            });
          }
          if (!ok) return error('操作未保存，请检查浏览器本地存储。');
          closeDialog();
          render();
          toast(type === 'deck' ? '卡片库已创建。' : type === 'card' ? '卡片已保存到本机。' : '每日目标已更新。');
        });
      }
      function action(event) {
        const button = event.target.closest('[data-action]');
        if (!button || button.disabled) return;
        const a = button.dataset.action;
        if (a === 'close') {
          closeDialog();
          return;
        }
        if (a === 'login') {
          if (
            change((next) => {
              next.demoSession = true;
            })
          ) {
            go('overview');
            toast('已进入演示账号；这不是真实身份验证。');
          }
          return;
        }
        if (a === 'logout') {
          if (
            change((next) => {
              next.demoSession = false;
            })
          ) {
            session = null;
            browsing = null;
            browseShown = false;
            shown = false;
            render();
            toast('已退出演示账号；本机演示记录保留。');
          }
          return;
        }
        if (!data.demoSession) return;
        if (a === 'nav') go(button.dataset.route);
        if (a === 'category') {
          filter = button.dataset.category;
          if (route() !== 'overview') go('overview');
          else render();
        }
        if (a === 'new-deck') openEditor('deck');
        if (a === 'new-card') openEditor('card', button.dataset.deck);
        if (a === 'edit-card') openEditor('card', null, button.dataset.card);
        if (a === 'goal') openEditor('goal');
        if (a === 'start') start(button.dataset.deck);
        if (a === 'browse') browse(button.dataset.deck);
        if (a.startsWith('browse-') && browsing) {
          if (a === 'browse-reveal') browseShown = !browseShown;
          if (a === 'browse-prev') {
            browsing.index = Math.max(0, browsing.index - 1);
            browseShown = false;
          }
          if (a === 'browse-next') {
            browsing.index = Math.min(browsing.queue.length - 1, browsing.index + 1);
            browseShown = false;
          }
          if (a === 'browse-shuffle') {
            browsing.queue = shuffle(browsing.queue);
            browsing.index = 0;
            browseShown = false;
          }
          render();
        }
        if (a === 'end') {
          session = null;
          shown = false;
          go('overview');
        }
        if (a === 'reveal') {
          shown = true;
          render();
          document.querySelector('.rating')?.focus();
        }
        if (a === 'rate') rate(button.dataset.rating);
        if (a === 'custom-rate') {
          const days = Number($('#custom-days').value);
          if (!Number.isInteger(days) || days < 1 || days > 365) {
            toast('请输入 1–365 之间的整数天数。');
            $('#custom-days').focus();
            return;
          }
          rate('custom', days);
        }
        if (a === 'select-day') {
          selectedDay = button.dataset.day;
          render();
          const cell = app.querySelector('.heat-cell[data-day="' + selectedDay + '"]');
          showTip(cell);
        }
        if (a === 'toggle-card') {
          const answer = document.getElementById('answer-' + button.dataset.card);
          answer.hidden = !answer.hidden;
          button.setAttribute('aria-expanded', String(!answer.hidden));
          button.textContent = answer.hidden ? '查看答案' : '收起答案';
        }
      }
      app.addEventListener('click', action);
      app.addEventListener('pointerover', (event) => {
        const el = event.target.closest('[data-tip]');
        if (el) showTip(el);
      });
      app.addEventListener('pointerout', (event) => {
        if (event.target.closest('[data-tip]')) hideTip();
      });
      app.addEventListener('focusin', (event) => {
        const el = event.target.closest('[data-tip]');
        if (el) showTip(el);
      });
      app.addEventListener('focusout', (event) => {
        if (event.target.closest('[data-tip]')) hideTip();
      });
      window.addEventListener('scroll', hideTip, { passive: true });
      window.addEventListener('resize', hideTip);
      dialog.addEventListener('click', action);
      dialog.addEventListener('cancel', (event) => {
        event.preventDefault();
        closeDialog();
      });
      window.addEventListener('hashchange', () => {
        render();
        window.scrollTo(0, 0);
      });
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') hideTip();
        if (
          event.code === 'Space' &&
          route() === 'browse' &&
          browsing &&
          !dialog.open &&
          !event.target.closest('button,input,select,textarea,a')
        ) {
          event.preventDefault();
          browseShown = !browseShown;
          render();
        }
        if (
          event.code === 'Space' &&
          route() === 'review' &&
          session &&
          !shown &&
          !dialog.open &&
          !event.target.closest('button,input,select,textarea,a')
        ) {
          event.preventDefault();
          shown = true;
          render();
          document.querySelector('.rating')?.focus();
        }
      });
      render();
    </script>
  </body>
</html>
